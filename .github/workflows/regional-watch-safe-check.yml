name: Regional Watch execution - isolated offline checks
on:
  push:
    branches: [work/regional-watch-execution-20261115]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: High-risk translation and provenance regression
        run: node --test tests/architecture/translation-semantics.test.mjs tests/architecture/news-localization-provenance.test.mjs
      - name: News grouping and order
        run: node --test tests/architecture/news-quality.test.mjs
      - name: Editor/Monitor D1 fallback offline
        run: node --test tests/architecture/editor-mirror-cache.test.mjs tests/architecture/collector-cache.test.mjs
      - name: Translation candidate Python regression
        run: python -m unittest discover -s scripts -p 'test_translate_news_open_source.py' -v
      - name: Neon and D1 cache offline checks
        run: python -m unittest scripts.test_neon_mirror scripts.test_neon_to_d1 scripts.test_publish_neon_mirror -v
