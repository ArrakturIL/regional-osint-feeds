name: GDELT public regional news context

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_gdelt.py'
      - 'scripts/test_gdelt.py'
      - 'scripts/collector_rollout_flags.py'
      - 'config/collector-rollout.json'
      - '.github/workflows/gdelt.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: gdelt-regional-context
  cancel-in-progress: false

jobs:
  source-gate:
    # H-04: a source rolled back via source-control.yml skips this collector.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            config/source-controls.json
            storage/cloudflare/004_source_controls.sql
      - id: gate
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -m scripts.source_gate --workflow gdelt.yml
  gdelt-context:
    needs: source-gate
    if: needs.source-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read per-source approved cutover policy
        id: rollout
        run: python -m scripts.collector_rollout_flags --source gdelt
      - name: Syntax and offline parser checks
        run: |
          python -m py_compile scripts/collect_gdelt.py
          python scripts/test_gdelt.py
          python -m unittest scripts.test_gdelt_cursor -v
      - name: Prepare private verified Neon checkpoint reader (no external writes)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${NEON_DATABASE_URL:-}" ]; then
            python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          fi
      - name: Read recent public GDELT Project event exports
        id: collect
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m scripts.collect_gdelt
      - name: Shadow-write paired GDELT JSON to Neon (nonfatal until verified cutover)
        if: github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "Neon shadow skipped: NEON_DATABASE_URL not configured; GitHub JSON remains the reader"
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"; then
            echo "Neon shadow dependency unavailable; GitHub JSON remains active"
            exit 0
          fi
          python -m scripts.publish_neon_mirror --source gdelt --mode shadow
      - name: Sync verified gdelt cache from Neon to private D1
        id: neon_d1
        continue-on-error: true
        # Source-by-source cutover; empty repo variable means NO production D1 write.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (contains(format(',{0},', vars.REGIONAL_NEON_D1_SOURCES), ',gdelt,') || steps.rollout.outputs.enabled == 'true')
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ] || [ -z "${CLOUDFLARE_D1_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "D1 cache selected but scoped secrets are missing; no legacy commit disabled"
            exit 1
          fi
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python -m scripts.publish_neon_mirror --source gdelt --mode required
          python -m scripts.neon_to_d1 --source gdelt --init-table
      - name: Commit only small bounded news-context metadata
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.collect.outcome == 'success' && !((contains(format(',{0},', vars.REGIONAL_NEON_PRIMARY_SOURCES), ',gdelt,') || steps.rollout.outputs.enabled == 'true') && steps.neon_d1.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/gdelt-context.json ]; then git add data/gdelt-context.json; fi
          if [ -f data/gdelt-status.json ]; then git add data/gdelt-status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update GDELT public regional news context"
            git push
          fi
      - name: Signal Neon primary failure after attempting Legacy GitHub fallback
        if: always() && (contains(format(',{0},', vars.REGIONAL_NEON_PRIMARY_SOURCES), ',gdelt,') || steps.rollout.outputs.enabled == 'true') && steps.neon_d1.outcome == 'failure'
        run: |
          echo "::error::Neon D1 primary sync failed for gdelt; Legacy GitHub data writeback was attempted"
          exit 1
