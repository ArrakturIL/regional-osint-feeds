name: Regional Watch site visitors (Web Analytics -> D1)

# Owner 20.11: visits and page views at the top of /ops. Cloudflare Web
# Analytics (no cookies) -> usage_daily in private D1, every 30 minutes.
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/site_visitors.py'
      - 'scripts/test_site_visitors.py'
      - 'config/web-analytics.json'
      - '.github/workflows/site-visitors.yml'

permissions:
  contents: read

concurrency:
  group: regional-watch-site-visitors
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.test_site_visitors -v
      - name: Read Web Analytics and store in D1
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.site_visitors
