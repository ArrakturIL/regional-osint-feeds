name: Collect UNOSAT official geospatial analyses
on:
  workflow_dispatch:
  schedule:
    - cron: "19 */12 * * *"
  push:
    branches: [main]
    paths:
      - scripts/collect_unosat.py
      - scripts/test_unosat.py
      - .github/workflows/unosat-analyses.yml
  pull_request:
    paths:
      - scripts/collect_unosat.py
      - scripts/test_unosat.py
      - .github/workflows/unosat-analyses.yml
permissions:
  contents: write
concurrency:
  group: unosat-official-mirror
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline data contract tests
        run: python -m unittest discover -s scripts -p "test_unosat.py" -v
      - name: Read public UNOSAT ArcGIS service directory
        run: python scripts/collect_unosat.py
      - name: Commit public-only metadata to GitHub (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unosat-analysis.json data/unosat-analysis-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh UNOSAT public satellite-analysis layer mirror"
            # Independent scheduled collectors may update main while we run.
            # Rebase and retry without force-pushing or replacing their metadata.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Mirror rebase conflict; refusing to overwrite other collector data."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Mirror published successfully on attempt $attempt"
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Unable to publish mirror after five safe retries"
            exit 1
          fi
