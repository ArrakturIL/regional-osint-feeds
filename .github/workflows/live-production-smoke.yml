name: Regional Watch live production smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - 'scripts/test_live_regional_watch.py'
      - '.github/workflows/live-production-smoke.yml'
  pull_request:
    paths:
      - 'scripts/test_live_regional_watch.py'
      - '.github/workflows/live-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate external Worker and Pages endpoints
        run: python scripts/test_live_regional_watch.py
