name: Regional Watch isolated Worker source handoff
on:
  push:
    branches: [fix/collector-storage-cutover-20261115]
    paths: ['.github/workflows/worker-bundle-handoff.yml']
permissions:
  contents: write
concurrency:
  group: regional-watch-isolated-worker-handoff
  cancel-in-progress: false
jobs:
  bundle:
    if: github.ref == 'refs/heads/fix/collector-storage-cutover-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker source contracts before bundling
        run: |
          node --test tests/architecture/editor-modules.test.mjs tests/architecture/collector-cache.test.mjs
          node --test backend/monitor/tests/source-parity.test.mjs
      - name: Produce isolated modular bundles
        run: |
          mkdir -p deploy/artifacts
          npm exec --yes --package=esbuild@0.25.0 -- esbuild backend/editor/src/index.js --bundle --format=esm --target=es2022 --outfile=deploy/artifacts/editor.mjs
          npm exec --yes --package=esbuild@0.25.0 -- esbuild backend/monitor/src/index.js --bundle --format=esm --target=es2022 --outfile=deploy/artifacts/monitor.mjs
          node --check deploy/artifacts/editor.mjs
          node --check deploy/artifacts/monitor.mjs
      - name: Persist exact bundles on isolated branch for audited Cloudflare QA (never main)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deploy/artifacts/editor.mjs deploy/artifacts/monitor.mjs
          git diff --cached --quiet && exit 0
          git commit -m "build(qa): isolated audited Worker bundles [skip ci]"
          git push origin HEAD:fix/collector-storage-cutover-20261115
