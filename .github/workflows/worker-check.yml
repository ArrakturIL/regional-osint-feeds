name: Validate Regional Watch Worker

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < worker/regional-osint-monitor.js
      - name: Check integrated news/analyst editor modules and routes
        run: |
          node --check worker/regional-watch-editor.js
          node --check worker/analysts-editor.mjs
          node --check worker/analysts-translation.mjs
          node worker/test-news-analysts-integration.mjs
          node worker/test-analysts.mjs
          node worker/test-analysts-translation.mjs
      - name: Run aviation API and data-quality regression tests
        run: node worker/test-aviation.mjs
      - name: Validate OpenSky and ADS-B Exchange adapters without network calls
        run: node worker/test-provider-adapters.mjs
      - name: Validate provider collectors and credential gates
        run: node worker/test-provider-collectors.mjs
      - name: Validate ADS-B recovery and cooldown scheduler
        run: node worker/test-adsb-recovery.mjs
      - name: Validate Sentinel and OpenAerialMap catalog collectors
        run: node worker/test-geo-catalog.mjs
      - name: Validate GDELT News Context Mirror
        run: node worker/test-gdelt.mjs
