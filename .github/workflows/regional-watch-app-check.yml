name: Regional Watch application source checks
on:
  push:
    branches: [refactor/regional-watch-modular-20261114]
  pull_request:
    paths: ['backend/**', 'frontend/**', 'shared/**', 'tests/architecture/**', '.github/workflows/regional-watch-app-check.yml']
permissions:
  contents: read
jobs:
  editor-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Editor source parity, import graph, syntax and runtime bindings
        run: node --test tests/architecture/editor-modules.test.mjs
