name: Regional Watch application source checks
on:
  push:
    branches: [refactor/regional-watch-modular-20261114, feature/integrated-data-quality-neon-20261115, release/regional-watch-architecture-20261115, main]
    # Data collectors commit JSON to main frequently. Never rebuild/redeploy for data-only commits.
    paths: ['backend/**', 'frontend/**', 'shared/**', 'tests/**', 'deploy/**', 'scripts/release/**', 'scripts/audit_collector_cache.py', 'scripts/test_audit_collector_cache.py', 'scripts/test_p1_backup_contract.py', 'scripts/sync_collector_shadows.py', 'scripts/sync_neon_primary_to_d1.py', 'scripts/test_sync_neon_primary_to_d1.py', 'scripts/collector_rollout_flags.py', 'scripts/test_collector_rollout_flags.py', 'config/collector-rollout.json', '.github/workflows/gdelt.yml', 'scripts/test_collector_shadow_pipeline.py', '.github/workflows/collector-shadow-sync.yml', 'storage/cloudflare/002_p1_translation_repair_backups.sql', 'storage/cloudflare/003_p1_translation_backup_capture.sql', '.github/workflows/regional-watch-app-check.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'shared/**', 'tests/**', 'deploy/**', 'scripts/release/**', 'scripts/audit_collector_cache.py', 'scripts/test_audit_collector_cache.py', 'scripts/test_p1_backup_contract.py', 'scripts/sync_collector_shadows.py', 'scripts/sync_neon_primary_to_d1.py', 'scripts/test_sync_neon_primary_to_d1.py', 'scripts/collector_rollout_flags.py', 'scripts/test_collector_rollout_flags.py', 'config/collector-rollout.json', '.github/workflows/gdelt.yml', 'scripts/test_collector_shadow_pipeline.py', '.github/workflows/collector-shadow-sync.yml', 'storage/cloudflare/002_p1_translation_repair_backups.sql', 'storage/cloudflare/003_p1_translation_backup_capture.sql', '.github/workflows/regional-watch-app-check.yml']
permissions:
  contents: read
jobs:
  editor-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/architecture/editor-modules.test.mjs tests/architecture/editor-rss-boundary.test.mjs tests/architecture/editor-scheduled-translations.test.mjs tests/architecture/editor-translation-atomic-budget.test.mjs tests/architecture/editor-ru-event-representative-selection.test.mjs tests/architecture/editor-he-event-representative-selection.test.mjs tests/architecture/editor-official-posts-api.test.mjs tests/architecture/editor-monitor-changes-api.test.mjs tests/architecture/editor-ai-comments.test.mjs tests/architecture/editor-news-ingestion.test.mjs tests/architecture/editor-scan-orchestration.test.mjs tests/architecture/editor-localization-scheduled.test.mjs tests/architecture/editor-localization-budget-backlog.test.mjs tests/architecture/editor-localization-retry-policy.test.mjs tests/architecture/editor-localization-analysts.test.mjs tests/architecture/editor-localization-content-readers.test.mjs tests/architecture/editor-analyst-public-api.test.mjs tests/architecture/editor-analyst-source-ingestion.test.mjs tests/architecture/editor-analyst-decision.test.mjs tests/architecture/editor-analyst-queue-runner.test.mjs
      - name: Guard chronological event provenance and source assertions on modular Editor
        run: node --test tests/architecture/news-quality.test.mjs
      - name: ARCH-03 cross-component Editor structural and Pages runtime acceptance
        run: node --test tests/architecture/editor-cross-component-acceptance.test.mjs
      - name: Verify high-impact translation fidelity and article provenance
        run: node --test tests/architecture/translation-semantics.test.mjs tests/architecture/news-localization-provenance.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python mirror translations preserve conditionality
        run: python -m unittest discover -s scripts -p 'test_translate_news_open_source.py' -v
      - name: Validate read-only D1 parity reporter offline
        run: python -m unittest scripts.test_audit_collector_cache -v
      - name: Verify source-by-source cutover approval contract
        run: python -m unittest scripts.test_collector_rollout_flags -v
      - name: Verify Neon-primary read-cache replication contract
        run: python -m unittest scripts.test_sync_neon_primary_to_d1 -v
      - name: Validate coordinated release contract (TDD)
        run: node --test tests/architecture/release-pipeline.test.mjs
      - name: Verify integrated eight-source shadow sync contract offline
        run: python -m unittest scripts.test_collector_shadow_pipeline -v
      - name: Test immutable production translation backup offline
        run: python -m unittest scripts.test_p1_backup_contract -v
  frontend-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/source-parity.test.mjs frontend/tests/app-render-runtime.test.mjs frontend/tests/news-archive-filters.test.mjs
      - run: |
          node frontend/scripts/build.mjs
          node --check frontend/dist/assets/app.js
          node --test frontend/tests/styles.test.mjs
  monitor-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/monitor/tests/source-parity.test.mjs backend/monitor/tests/import-boundaries.test.mjs backend/monitor/tests/schedule-cadence.test.mjs
      - run: |
          node backend/monitor/scripts/build.mjs
          node --check backend/monitor/dist/worker.js
          node --test tests/architecture/collector-cache.test.mjs
  modern-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle frontend from native ES modules
        run: npm exec --yes --package=esbuild@0.25.0 -- esbuild frontend/src/entry.js --bundle --format=iife --target=es2022 --outfile=frontend/dist/assets/app.modern.js
      - name: Bundle Monitor from native ES modules
        run: npm exec --yes --package=esbuild@0.25.0 -- esbuild backend/monitor/src/index.js --bundle --format=esm --target=es2022 --outfile=backend/monitor/dist/worker.modern.mjs
      - name: Bundle Editor from native ES modules
        run: npm exec --yes --package=esbuild@0.25.0 -- esbuild backend/editor/src/index.js --bundle --format=esm --target=es2022 --outfile=backend/editor/dist/worker.modern.mjs
      - name: Validate loadable Worker exports and React bundle
        run: node --test tests/architecture/modern-bundles.test.mjs
      - name: Audit legacy dependency reachability before archive decisions
        run: |
          node --test tests/architecture/legacy-dependency-audit.test.mjs
          node scripts/audit_legacy_dependencies.mjs --summary
      - name: Verify protected Monitor summary contract on modern source
        run: node --test backend/monitor/tests/summary-runtime.test.mjs
      - name: Verify live provider cooldown and AvioADSB quota policy on modern source
        run: node --test backend/monitor/tests/provider-recovery-runtime.test.mjs
      - name: Audit ARCH-01 active runtime graph and eight Neon-to-D1 collector boundaries
        run: node --test tests/architecture/active-architecture-audit.test.mjs
      - name: Emit reproducible active backend architecture audit summary
        run: node scripts/audit_active_architecture.mjs --summary
      - name: Verify production provider client backoff and D1 quota safety
        run: node --test backend/monitor/tests/provider-client-runtime.test.mjs
      - name: Verify live satellite catalogue metadata and provider failure semantics
        run: node --test backend/monitor/tests/geo-catalog-runtime.test.mjs
      - name: Verify preserved Editor legacy translation and news invariants on modular source
        run: node --test tests/architecture/legacy-editor-runtime-parity.test.mjs

  pages-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve RU/HE HTML skeletons and script dependencies
        run: node --test frontend/tests/documents.test.mjs

  pages-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce static routes and vendor scripts from frozen source
        run: node frontend/scripts/build-site.mjs
      - name: Check all eight exact HTML shells and bundled assets
        run: node --test frontend/tests/site-build.test.mjs

  pages-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publicly exposed API ownership and local HTML routes
        run: node --test tests/architecture/pages-routing.test.mjs

  pages-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify overview adapter against D1 schema fixtures
        run: node --test tests/architecture/pages-overview.test.mjs

  pages-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Market history and source-backed public data contract
        run: node --test tests/architecture/pages-data.test.mjs

  pages-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify self-contained server routing and service boundaries
        run: node --test tests/architecture/pages-runtime.test.mjs
      - name: Bundle advanced-mode Pages Worker and static files
        run: |
          node frontend/scripts/build-site.mjs
          npm exec --yes --package=esbuild@0.25.0 -- esbuild backend/pages/src/index.js --bundle --format=esm --target=es2022 --outfile=frontend/dist/_worker.js
          node --check frontend/dist/_worker.js
      - name: Fail if built Pages depends on previous Pages deployments
        run: |
          if grep -Eq 'ee6aa366|0f39f36e\\.regional-watch\\.pages\\.dev' frontend/dist/_worker.js; then
            echo 'Forbidden previous-deployment dependency'; exit 1
          fi
      - name: RW Pages preview build — immutable artifact (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: regional-watch-pages-preview
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  pages-preview:
    name: Publish isolated Cloudflare Pages preview after all checks
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/refactor/regional-watch-modular-20261114' || github.ref == 'refs/heads/feature/integrated-data-quality-neon-20261115' || github.ref == 'refs/heads/release/regional-watch-architecture-20261115'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/regional-watch-architecture-20261115' && github.base_ref == 'main')
    needs: [editor-source, frontend-source, monitor-source, modern-bundles, pages-documents, pages-static, pages-routing, pages-overview, pages-data, pages-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: regional-watch-pages-preview-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Download the already-verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: regional-watch-pages-preview
          path: dist
      - name: Check credentials without printing secrets
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Preview upload skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured in GitHub Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Refuse Pages Preview when any Worker or D1 binding points at production
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release/cloudflare-gate.mjs preview-check
      - name: Upload preview to a non-production branch only
        id: pages-upload
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=regional-watch --branch=${{ (github.head_ref == 'release/regional-watch-architecture-20261115' || github.ref == 'refs/heads/release/regional-watch-architecture-20261115') && 'rw-architecture-preview' || (github.ref == 'refs/heads/feature/integrated-data-quality-neon-20261115' && 'rw-integrated-preview' || 'rw-modular-preview') }}
      - name: Verify deployed preview HTTP routes (no redirect loops)
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.pages-upload.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.pages-upload.outputs.pages-environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PAGES_ENVIRONMENT" != "preview" ]]; then
            echo "Refusing smoke test: deployment was not preview ($PAGES_ENVIRONMENT)"; exit 1
          fi
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9-]+\.regional-watch\.pages\.dev/?$ ]]; then
            echo "Unexpected deployment URL; refusing to test an unverified host"; exit 1
          fi
          base="${DEPLOYMENT_URL%/}"
          for path in / '/?utm_source=chatgpt.com' /he/ /events/ /he/events/ /data/ /he/data/ /analysts/ /he/analysts/ /analysts/smoke-post /he/analysts/smoke-post /assets/app.js /assets/app.css; do
            # Retry transient 404/503 during Cloudflare edge propagation, but never follow redirects.
            status=000
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --silent --show-error --max-time 20 --max-redirs 0 --output /tmp/rw-preview-body --dump-header /tmp/rw-preview-headers --write-out '%{http_code}' "$base$path") || status=000
              echo "$path attempt $attempt => HTTP $status"
              if [[ "$status" == "200" ]]; then break; fi
              if [[ "$status" != "404" && "$status" != "503" && "$status" != "000" ]]; then break; fi
              if [[ "$attempt" != "6" ]]; then sleep 3; fi
            done
            if [[ "$status" != "200" ]]; then
              echo "Preview route returned non-200, including possible redirect loop: $path"; exit 1
            fi
            if [[ "$path" == /assets/*.js ]]; then
              grep -qi '^content-type:.*javascript' /tmp/rw-preview-headers
            elif [[ "$path" == /assets/*.css ]]; then
              grep -qi '^content-type:.*text/css' /tmp/rw-preview-headers
            else
              grep -qi '^content-type:.*text/html' /tmp/rw-preview-headers
              if [[ "$path" == /he* ]]; then
                grep -Fq 'lang="he"' /tmp/rw-preview-body
              else
                grep -Fq 'lang="ru"' /tmp/rw-preview-body
              fi
            fi
          done
      - name: Cloudflare Pages preview API wiring smoke
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.pages-upload.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          for path in '/api/overview' '/api/data' '/api/news?lang=ru&limit=5' '/api/news?lang=he&limit=5'; do
            status=000
            # Bounded warm-edge retries only; no unbounded polling after failure.
            for attempt in 1 2 3; do
              status=$(curl --silent --show-error --max-time 20 --max-redirs 0 \
                --output /tmp/rw-api-body --dump-header /tmp/rw-api-headers \
                --write-out '%{http_code}' "$base$path") || status=000
              echo "$path attempt $attempt => HTTP $status"
              if [[ "$status" == "200" ]]; then break; fi
              if [[ "$status" != "404" && "$status" != "503" && "$status" != "000" ]]; then break; fi
              if [[ "$attempt" != "3" ]]; then sleep 2; fi
            done
            test "$status" = "200" || { echo "::error::Preview API wiring failure: $path"; exit 1; }
            grep -qi '^content-type:.*application/json' /tmp/rw-api-headers
            jq -e 'type == "object"' /tmp/rw-api-body >/dev/null
          done
      - name: Record the exact tested source commit
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          echo "Preview release source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview branch: rw-integrated-preview or rw-modular-preview (production branch remains main)' >> "$GITHUB_STEP_SUMMARY"


  release-bundle:
    name: Build immutable three-component release
    needs: [editor-source, frontend-source, monitor-source, modern-bundles, pages-documents, pages-static, pages-routing, pages-overview, pages-data, pages-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify coordinated release unit contracts
        run: node --test tests/architecture/release-pipeline.test.mjs
      - name: ARCH-07 final Pages/Editor/Monitor public boundaries and rollback acceptance
        run: node --test tests/architecture/arch07-integration-acceptance.test.mjs
      - name: Assemble Pages and Worker bundles and verify the exact source SHA
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/release/build.mjs "$SOURCE_SHA"
          node scripts/release/verify.mjs "$SOURCE_SHA"
      - name: Wrangler dry-run both Worker release configs (never deploy)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm exec --yes --package=wrangler@4 -- wrangler deploy --config release/config/editor.json --no-bundle --dry-run --outdir "$RUNNER_TEMP/rw-editor-dry-run"
          npm exec --yes --package=wrangler@4 -- wrangler deploy --config release/config/monitor.json --no-bundle --dry-run --outdir "$RUNNER_TEMP/rw-monitor-dry-run"
      - name: Upload single immutable verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rw-unified-release-bundle
          path: release/
          retention-days: 30
          if-no-files-found: error

  release-production:
    name: Publish coordinated Pages and Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: regional-watch-coordinated-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: rw-unified-release-bundle
          path: release
      - name: Require identical checked-out code and verified artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/release/verify.mjs "$SOURCE_SHA"
      - name: Require existing Pages and infrastructure Cloudflare credentials before changing any production service
        env:
          PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INFRA_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$PAGES_TOKEN" || -z "$INFRA_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "::error::Coordinated publish blocked: Pages and existing D1+Workers Admin infrastructure tokens are both required"
            exit 1
          fi
          echo 'Existing Pages and D1+Workers Admin credentials provided; beginning read-only preflight'
      - name: Verify live D1 schema is compatible (read-only; never execute migrations)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/release/d1-preflight.mjs
      - name: Capture verified production binding and exact rollback versions before any write
        env:
          SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE: ${{ runner.temp }}/rw-release-baseline.json
        run: node scripts/release/cloudflare-gate.mjs capture "$SOURCE_SHA" "$BASELINE"
      - name: Deploy tested Editor module (no rebuild; preserve secrets and vars)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config release/config/editor.json --no-bundle
      - name: Deploy tested Monitor module (no rebuild; preserve secrets and vars)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config release/config/monitor.json --no-bundle
      - name: Check that published Workers preserved cron and all private bindings
        env:
          SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE: ${{ runner.temp }}/rw-release-baseline.json
        run: node scripts/release/cloudflare-gate.mjs postcheck "$SOURCE_SHA" "$BASELINE"
      - name: Deploy the EXACT same-SHA Pages artifact after both Workers
        id: pages-upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy release/pages --project-name=regional-watch --branch=main
      - name: Production release technical smoke (routes and Pages environment only)
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages-upload.outputs.pages-environment }}
          DEPLOYMENT_URL: ${{ steps.pages-upload.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test "$PAGES_ENVIRONMENT" = production || { echo "::error::Pages deployment is not production"; exit 1; }
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-z0-9-]+\.regional-watch\.pages\.dev/?$ ]]; then
            echo "::error::Unexpected Pages hostname"; exit 1
          fi
          for path in / /he/ /api/overview; do
            status=000
            # Newly published Pages deployments can return 404 briefly until
            # edge propagation. Retry only transient 404, 503 and no-response.
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --silent --show-error --max-time 20 --max-redirs 0 -o /dev/null -w '%{http_code}' "${DEPLOYMENT_URL%/}$path") || status=000
              echo "$path propagation attempt $attempt: HTTP $status"
              if [[ "$status" == 200 ]]; then break; fi
              if [[ "$status" != 404 && "$status" != 503 && "$status" != 000 ]]; then break; fi
              if [[ "$attempt" != 6 ]]; then sleep 3; fi
            done
            test "$status" = 200 || { echo "::error::Release route $path HTTP $status"; exit 1; }
          done
      - name: Verify production service bindings after Pages publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE: ${{ runner.temp }}/rw-release-baseline.json
        run: node scripts/release/cloudflare-gate.mjs postcheck "$SOURCE_SHA" "$BASELINE"
      - name: Record actual production version IDs and D1 migration digests
        env:
          SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE: ${{ runner.temp }}/rw-release-baseline.json
          RECEIPT: ${{ runner.temp }}/rw-release-receipt.json
        run: node scripts/release/cloudflare-gate.mjs receipt "$SOURCE_SHA" "$BASELINE" "$RECEIPT"
      - name: Record coordinated source SHA and immutable release receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "Pages + Editor + Monitor source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle name: rw-unified-release-bundle" >> "$GITHUB_STEP_SUMMARY"
          cat release/manifest.json | sha256sum | sed 's/ .*//' | xargs -I{} echo "Manifest SHA-256: {}" >> "$GITHUB_STEP_SUMMARY"
      - name: Automatic exact-version rollback on any partial publish failure
        if: failure()
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGES_PUBLISH_SUCCEEDED: ${{ steps.pages-upload.outcome == 'success' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE: ${{ runner.temp }}/rw-release-baseline.json
        run: |
          if [[ -s "$BASELINE" ]]; then
            node scripts/release/cloudflare-gate.mjs rollback "$SOURCE_SHA" "$BASELINE"
          else
            echo 'No deployment started; rollback baseline was never captured.'
          fi
      - name: Archive deployed version receipt for release history
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rw-coordinated-release-receipt
          path: ${{ runner.temp }}/rw-release-receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve redacted rollback receipt for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-coordinated-rollback-baseline
          path: ${{ runner.temp }}/rw-release-baseline.json
          retention-days: 30
          if-no-files-found: ignore
