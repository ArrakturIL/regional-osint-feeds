name: Regional Watch analyst public-source collection
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/collect_analysts.py'
      - 'scripts/test_analysts.py'
      - 'scripts/verify_analyst_mirror.py'
      - 'scripts/test_analyst_mirror.py'
      - 'config/analysts.json'
      - '.github/workflows/analysts.yml'
      - 'worker/analysts-editor.mjs'
      - 'worker/analysts-translation.mjs'
      - 'worker/analysts-translation-migration.sql'
      - 'worker/test-analysts.mjs'
      - 'worker/test-analysts-translation.mjs'
  pull_request:
    paths:
      - 'scripts/collect_analysts.py'
      - 'scripts/test_analysts.py'
      - 'scripts/verify_analyst_mirror.py'
      - 'scripts/test_analyst_mirror.py'
      - 'config/analysts.json'
      - '.github/workflows/analysts.yml'
      - 'worker/analysts-editor.mjs'
      - 'worker/analysts-translation.mjs'
      - 'worker/analysts-translation-migration.sql'
      - 'worker/test-analysts.mjs'
      - 'worker/test-analysts-translation.mjs'
  workflow_dispatch:
  schedule:
    # Four staggered chances per hour; GitHub may delay or drop scheduled runs.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: regional-watch-analysts-mirror
  cancel-in-progress: false
jobs:
  collect-analysts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests and syntax checks
        run: |
          python -m py_compile scripts/collect_analysts.py
          python scripts/test_analysts.py
          python scripts/test_analyst_mirror.py
          node --check worker/analysts-editor.mjs
          node worker/test-analysts.mjs
          node worker/test-analysts-translation.mjs
      - name: Collect official public-source content
        run: python scripts/collect_analysts.py
      - name: Validate the two fresh mirror files
        run: python scripts/verify_analyst_mirror.py --max-age-minutes 15
      - name: Commit bounded mirror and source heartbeat
        # Code pushes to main must also publish mirrors. Bot data-only commits
        # don't retrigger this workflow because data paths are excluded.
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/analyst-source-items.json ]; then git add data/analyst-source-items.json; fi
          if [ -f data/analyst-source-status.json ]; then git add data/analyst-source-status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh analyst public-source mirror'
            # Other independent collectors may commit to main between checkout
            # and push. Rebase on the newest remote main; never force-push.
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Analyst mirror rebase conflict; refusing to overwrite other source data.'
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Unable to publish analyst mirror after four non-force push attempts'
            exit 1
          fi

      - name: Verify published mirror on remote main
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from scripts.verify_analyst_mirror import validate
          read = lambda file: json.loads(subprocess.check_output(
              ['git','show','origin/main:data/'+file], text=True))
          status = read('analyst-source-status.json')
          items = read('analyst-source-items.json')
          report = validate(items, status, max_age_minutes=20)
          print('Published analyst mirror:', json.dumps(report, ensure_ascii=False))
          PY
