name: Regional Watch analyst public-source collection
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/collect_analysts.py'
      - 'scripts/test_analysts.py'
      - 'scripts/verify_analyst_mirror.py'
      - 'scripts/test_analyst_mirror.py'
      - 'config/analysts.json'
      - '.github/workflows/analysts.yml'
      - 'worker/analysts-editor.mjs'
      - 'worker/analysts-translation.mjs'
      - 'worker/analysts-translation-migration.sql'
      - 'worker/test-analysts.mjs'
      - 'worker/test-analysts-translation.mjs'
  pull_request:
    paths:
      - 'scripts/collect_analysts.py'
      - 'scripts/test_analysts.py'
      - 'scripts/verify_analyst_mirror.py'
      - 'scripts/test_analyst_mirror.py'
      - 'config/analysts.json'
      - '.github/workflows/analysts.yml'
      - 'worker/analysts-editor.mjs'
      - 'worker/analysts-translation.mjs'
      - 'worker/analysts-translation-migration.sql'
      - 'worker/test-analysts.mjs'
      - 'worker/test-analysts-translation.mjs'
  workflow_dispatch:
  schedule:
    # Four staggered chances per hour; GitHub may delay or drop scheduled runs.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: regional-watch-analysts-mirror
  cancel-in-progress: false
jobs:
  collect-analysts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests and syntax checks
        run: |
          python -m py_compile scripts/collect_analysts.py
          python scripts/test_analysts.py
          python scripts/test_analyst_mirror.py
          node --check worker/analysts-editor.mjs
          node worker/test-analysts.mjs
          node worker/test-analysts-translation.mjs
      - name: Collect official public-source content
        run: python scripts/collect_analysts.py
      - name: Validate the two fresh mirror files
        run: python scripts/verify_analyst_mirror.py --max-age-minutes 15
      - name: Commit bounded mirror and source heartbeat
        # Only collector JSON lives in GitHub; no backend files are deployed here.
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mirror_dir="$RUNNER_TEMP/regional-watch-analyst-mirror"
          mkdir -p "$mirror_dir"
          cp data/analyst-source-items.json "$mirror_dir/analyst-source-items.json"
          cp data/analyst-source-status.json "$mirror_dir/analyst-source-status.json"
          # Snapshot the newest main and overlay only these two generated files.
          # Rebasing JSON blobs caused collisions against concurrent collector commits.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if MIRROR_DIR="$mirror_dir" python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          local=json.loads((Path(os.environ["MIRROR_DIR"])/"analyst-source-status.json").read_text())
          try:
              remote=json.loads(subprocess.check_output(
                  ["git","show","origin/main:data/analyst-source-status.json"],text=True))
          except subprocess.CalledProcessError:
              remote={}
          # Do not overwrite a more recent collector heartbeat.
          raise SystemExit(0 if remote.get("checked_at","") >= local.get("checked_at","") else 1)
          PY
            then
              echo 'A newer/equal analyst mirror is already on main.'
              exit 0
            fi
            git reset --hard origin/main
            cp "$mirror_dir/analyst-source-items.json" data/analyst-source-items.json
            cp "$mirror_dir/analyst-source-status.json" data/analyst-source-status.json
            git add data/analyst-source-items.json data/analyst-source-status.json
            if git diff --cached --quiet; then
              echo 'Mirror is already current.'
              exit 0
            fi
            git commit -m 'Refresh analyst public-source mirror'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish analyst mirror after five non-force push attempts'
          exit 1

      - name: Verify published mirror on remote main
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from scripts.verify_analyst_mirror import validate
          read = lambda file: json.loads(subprocess.check_output(
              ['git','show','origin/main:data/'+file], text=True))
          status = read('analyst-source-status.json')
          items = read('analyst-source-items.json')
          report = validate(items, status, max_age_minutes=20)
          print('Published analyst mirror:', json.dumps(report, ensure_ascii=False))
          PY
