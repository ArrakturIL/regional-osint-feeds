name: Refresh official CENTCOM DVIDS news

on:
  push:
    paths:
      - "scripts/collect_centcom.py"
      - "scripts/centcom_writeback.py"
      - "scripts/test_centcom_writeback.py"
      - ".github/workflows/centcom-test.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: official-centcom-feed
  cancel-in-progress: false

jobs:
  fetch-official-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test competing collector writeback
        run: python3 -m unittest scripts.test_centcom_writeback
      - name: Fetch and validate official DVIDS CENTCOM news
        id: collect
        run: python3 scripts/collect_centcom.py
      - name: Commit updated news or status heartbeat
        if: always() && github.ref == 'refs/heads/main' && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/centcom-news.json ]; then git add data/centcom-news.json; fi
          if [ -f data/centcom-status.json ]; then git add data/centcom-status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official CENTCOM DVIDS news feed"
            python3 scripts/centcom_writeback.py
          else
            echo "No new publications or status changes"
          fi

