name: Refresh official CENTCOM DVIDS news

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_centcom.py"
      - "scripts/centcom_writeback.py"
      - "scripts/test_centcom_writeback.py"
      - ".github/workflows/centcom-test.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: official-centcom-feed
  cancel-in-progress: false

jobs:
  fetch-official-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test competing collector writeback
        run: python3 -m unittest scripts.test_centcom_writeback
      - name: Fetch and validate official DVIDS CENTCOM news
        id: collect
        run: python3 scripts/collect_centcom.py
      - name: Shadow-write validated centcom mirror to Neon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "Neon shadow skipped: no configured secret; GitHub remains active"
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"; then
            echo "Neon shadow dependency unavailable; GitHub remains active"
            exit 0
          fi
          python -m scripts.publish_neon_mirror --source centcom --mode shadow
      - name: Sync verified centcom cache from Neon to private D1
        id: neon_d1
        continue-on-error: true
        # Source-by-source cutover; empty repo variable means NO production D1 write.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(format(',{0},', vars.REGIONAL_NEON_D1_SOURCES), ',centcom,')
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ] || [ -z "${CLOUDFLARE_D1_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "D1 cache selected but scoped secrets are missing; no legacy commit disabled"
            exit 1
          fi
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python -m scripts.publish_neon_mirror --source centcom --mode required
          python -m scripts.neon_to_d1 --source centcom --init-table
      - name: Commit updated news or status heartbeat
        if: always() && github.ref == 'refs/heads/main' && steps.collect.outcome != 'skipped' && !(contains(format(',{0},', vars.REGIONAL_NEON_PRIMARY_SOURCES), ',centcom,') && steps.neon_d1.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/centcom-news.json ]; then git add data/centcom-news.json; fi
          if [ -f data/centcom-status.json ]; then git add data/centcom-status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official CENTCOM DVIDS news feed"
            python3 scripts/centcom_writeback.py
          else
            echo "No new publications or status changes"
          fi
      - name: Signal Neon primary failure after attempting Legacy GitHub fallback
        if: always() && contains(format(',{0},', vars.REGIONAL_NEON_PRIMARY_SOURCES), ',centcom,') && steps.neon_d1.outcome == 'failure'
        run: |
          echo "::error::Neon D1 primary sync failed for centcom; Legacy GitHub data writeback was attempted"
          exit 1
