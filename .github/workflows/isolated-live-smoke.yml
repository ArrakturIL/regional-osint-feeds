name: Regional Watch Worker release live read-only smoke
on:
  push:
    branches: [fix/collector-storage-cutover-20261115]
    paths: ['.github/workflows/isolated-live-smoke.yml']
permissions:
  contents: read
jobs:
  live-read-only:
    if: github.ref == 'refs/heads/fix/collector-storage-cutover-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published Pages routes and Editor/Monitor JSON after modular Worker release
        shell: bash
        run: |
          set -euo pipefail
          base='https://regional-watch.pages.dev'
          for path in '/api/overview' '/api/data' '/api/news?lang=ru&limit=5' '/api/news?lang=he&limit=5' '/api/analyst-posts?lang=ru&limit=5'; do
            code=000
            for retry in 1 2 3; do
              code=$(curl --silent --show-error --max-time 25 --max-redirs 0 --output /tmp/response --dump-header /tmp/headers --write-out '%{http_code}' "$base$path") || code=000
              if [[ "$code" == 200 ]]; then break; fi
              if [[ "$retry" != 3 ]]; then sleep 3; fi
            done
            echo "$path HTTP $code"
            [[ "$code" == 200 ]] || exit 1
            grep -qi '^content-type:.*application/json' /tmp/headers
            jq -e 'type == "object"' /tmp/response >/dev/null
          done
          for path in / /he/ /events/ /he/events/; do
            code=$(curl --silent --show-error --max-time 25 --max-redirs 0 --output /dev/null --write-out '%{http_code}' "$base$path")
            echo "$path HTTP $code"
            [[ "$code" == 200 ]] || exit 1
          done
