name: Probe additional public OSINT feeds

on:
  push:
    paths:
      - ".github/workflows/source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # 19.11: are ADS-B and CENTCOM RSS blocked only for Cloudflare Workers?
      # From the Worker: adsb.lol 429, adsb.fi 403, CENTCOM RSS without dated
      # items. Same requests from a GitHub runner (different egress IPs).
      - name: Probe sources that fail from the Cloudflare Worker
        run: |
          python3 - <<'PY'
          import json, re, urllib.error, urllib.request
          SOURCES = {
              "adsb_lol_point": "https://api.adsb.lol/v2/point/32.0/35.0/250",
              "adsb_lol_mil": "https://api.adsb.lol/v2/mil",
              "adsb_fi_mil": "https://opendata.adsb.fi/api/v2/mil",
              "airplanes_live_mil": "https://api.airplanes.live/v2/mil",
              "airplanes_live_point": "https://api.airplanes.live/v2/point/32.0/35.0/250",
              "centcom_rss": "https://www.centcom.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=808&max=20",
          }
          for name, url in SOURCES.items():
              result = {"name": name}
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "regional-osint-feeds/1.0 (+https://regional-watch.pages.dev)",
                      "Accept": "application/json,application/rss+xml,text/xml;q=0.9,*/*;q=0.5",
                  })
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(400_001).decode("utf-8", "replace")
                      result.update(http=r.status, type=r.headers.get("Content-Type"), bytes=len(body))
                  try:
                      data = json.loads(body)
                      ac = data.get("ac") or data.get("aircraft") or []
                      result["aircraft"] = len(ac)
                  except json.JSONDecodeError:
                      result["rss_items"] = len(re.findall(r"<item[\s>]", body))
                      result["pub_dates"] = len(re.findall(r"<pubDate>", body))
                      result["head"] = re.sub(r"\s+", " ", body[:140])
              except urllib.error.HTTPError as e:
                  result.update(http=e.code, retry_after=e.headers.get("Retry-After"), server=e.headers.get("Server"))
              except Exception as e:
                  result["error"] = type(e).__name__ + ": " + str(e)[:150]
              print(json.dumps(result, ensure_ascii=False))
          PY
