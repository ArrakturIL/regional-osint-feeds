name: Regional Watch single-run validated shadow bootstrap
on:
  push:
    branches: [fix/collector-storage-cutover-20261115]
    paths: ['.github/workflows/isolated-shadow-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: regional-watch-collector-shadow-sync
  cancel-in-progress: false
jobs:
  shadow:
    if: github.ref == 'refs/heads/fix/collector-storage-cutover-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all shadow synchronization contracts offline
        run: python -m unittest scripts.test_collector_shadow_pipeline scripts.test_neon_mirror scripts.test_neon_to_d1 scripts.test_publish_neon_mirror -v
      - name: Require existing private Neon and scoped D1 credentials
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${NEON_DATABASE_URL:-}"
          test -n "${CLOUDFLARE_D1_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Install bounded Neon DB client
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Commit-free, verified eight-source Neon to D1 mirror
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.sync_collector_shadows --root .
