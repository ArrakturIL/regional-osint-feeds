name: Regional Watch integrated data architecture checks
on:
  push:
    branches: [feature/integrated-data-quality-neon-20261115]
    paths:
      - "storage/neon/**"
      - ".github/workflows/news-open-source-translation.yml"
      - ".github/workflows/unosat-analyses.yml"
      - ".github/workflows/satellite.yml"
      - ".github/workflows/marad.yml"
      - ".github/workflows/copernicus-analytics.yml"
      - ".github/workflows/centcom-test.yml"
      - ".github/workflows/analysts.yml"
      - ".github/workflows/gdelt.yml"
      - "scripts/neon_mirror.py"
      - "scripts/publish_neon_mirror.py"
      - "scripts/test_neon_mirror.py"
      - "scripts/test_publish_neon_mirror.py"
      - "tests/architecture/translation-semantics.test.mjs"
      - "scripts/translate_news_open_source.py"
      - "scripts/translation_semantics.py"
      - "scripts/test_translate_news_open_source.py"
      - "backend/editor/src/translations/**"
      - "tests/architecture/editor-modules.test.mjs"
      - ".github/workflows/integrated-data-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "storage/neon/**"
      - ".github/workflows/news-open-source-translation.yml"
      - ".github/workflows/unosat-analyses.yml"
      - ".github/workflows/satellite.yml"
      - ".github/workflows/marad.yml"
      - ".github/workflows/copernicus-analytics.yml"
      - ".github/workflows/centcom-test.yml"
      - ".github/workflows/analysts.yml"
      - ".github/workflows/gdelt.yml"
      - "scripts/neon_mirror.py"
      - "scripts/test_neon_mirror.py"
      - "tests/architecture/translation-semantics.test.mjs"
      - "scripts/translate_news_open_source.py"
      - "scripts/translation_semantics.py"
      - "scripts/test_translate_news_open_source.py"
      - "backend/editor/src/translations/**"
      - "tests/architecture/editor-modules.test.mjs"
      - ".github/workflows/integrated-data-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-neon-contract:
    name: Validate Neon snapshot contract without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no external API or secrets)
        run: python -m unittest scripts.test_neon_mirror scripts.test_publish_neon_mirror -v
      - name: Offline translation candidate regression checks
        run: python -m unittest discover -s scripts -p 'test_translate_news_open_source.py' -v
      - name: Semantic translation regression checks
        run: node --test tests/architecture/translation-semantics.test.mjs tests/architecture/editor-modules.test.mjs
