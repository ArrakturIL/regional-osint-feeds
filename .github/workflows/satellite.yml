name: NASA satellite context and natural events

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_satellite.py"
      - ".github/workflows/satellite.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: nasa-satellite-context
  cancel-in-progress: false

jobs:
  satellite-context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install "Pillow>=11,<13"
      - name: Syntax check
        run: python -m py_compile scripts/collect_satellite.py
      - name: Gather public NASA GIBS and EONET context
        run: python scripts/collect_satellite.py
      - name: Shadow-write validated satellite mirror to Neon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "Neon shadow skipped: no configured secret; GitHub remains active"
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"; then
            echo "Neon shadow dependency unavailable; GitHub remains active"
            exit 0
          fi
          python -m scripts.publish_neon_mirror --source satellite --mode shadow
      - name: Sync verified satellite cache from Neon to private D1
        # Source-by-source cutover; empty repo variable means NO production D1 write.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(format(',{0},', vars.REGIONAL_NEON_D1_SOURCES), ',satellite,')
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ] || [ -z "${CLOUDFLARE_D1_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "D1 cache selected but scoped secrets are missing; no legacy commit disabled"
            exit 1
          fi
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python -m scripts.publish_neon_mirror --source satellite --mode required
          python -m scripts.neon_to_d1 --source satellite --init-table
      - name: Commit only metadata, never satellite image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite-observations.json data/satellite-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public NASA satellite context metadata"
            git push
          else
            echo "No material metadata changes"
          fi
