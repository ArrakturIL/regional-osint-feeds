name: Collect Copernicus EMS analysis metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/collect_copernicus.py
      - scripts/test_copernicus.py
      - .github/workflows/copernicus-analytics.yml
  pull_request:
    paths:
      - scripts/collect_copernicus.py
      - scripts/test_copernicus.py
      - .github/workflows/copernicus-analytics.yml

permissions:
  contents: write

concurrency:
  group: copernicus-analytics-mirror
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector without network
        run: python -m unittest discover -s scripts -p "test_copernicus.py" -v
      - name: Harvest public Copernicus EMS API
        run: python scripts/collect_copernicus.py
      - name: Shadow-write validated copernicus mirror to Neon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "Neon shadow skipped: no configured secret; GitHub remains active"
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"; then
            echo "Neon shadow dependency unavailable; GitHub remains active"
            exit 0
          fi
          python -m scripts.publish_neon_mirror --source copernicus --mode shadow
      - name: Sync verified copernicus cache from Neon to private D1
        # Source-by-source cutover; empty repo variable means NO production D1 write.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(format(',{0},', vars.REGIONAL_NEON_D1_SOURCES), ',copernicus,')
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ] || [ -z "${CLOUDFLARE_D1_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "D1 cache selected but scoped secrets are missing; no legacy commit disabled"
            exit 1
          fi
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python -m scripts.publish_neon_mirror --source copernicus --mode required
          python -m scripts.neon_to_d1 --source copernicus --init-table
      - name: Commit public metadata mirror (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copernicus-analyses.json data/copernicus-analyses-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Copernicus public analysis metadata mirror"
            # Independent scheduled collectors may update main while we run.
            # Rebase and retry without force-pushing or replacing their metadata.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Mirror rebase conflict; refusing to overwrite other collector data."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Mirror published successfully on attempt $attempt"
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Unable to publish mirror after five safe retries"
            exit 1
          fi
