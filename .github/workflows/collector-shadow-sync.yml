name: Regional Watch Neon-primary D1 replica reconciliation

# Runs on main after source-by-source Neon-primary cutover. This job never
# imports the now-frozen GitHub JSON artifacts or writes commits. The individual
# collector workflows publish to Neon/D1; this is bounded reconciliation.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-watch-collector-shadow-sync
  cancel-in-progress: false

jobs:
  sync-shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify eight-source primary replica and legacy rollback contracts
        run: |
          python -m unittest scripts.test_sync_neon_primary_to_d1 scripts.test_collector_shadow_pipeline scripts.test_neon_mirror scripts.test_neon_to_d1 scripts.test_publish_neon_mirror -v
      - name: Require isolated Neon and D1 service credentials
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL:-}" || -z "${CLOUDFLARE_D1_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Required private storage credentials are missing; legacy GitHub data remains active"
            exit 1
          fi
      - name: Install bounded PostgreSQL client (no inference/model dependencies)
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Reconcile eight verified Neon-primary snapshots into private D1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.sync_neon_primary_to_d1
      - name: Record commit-free primary storage behavior
        run: |
          echo 'Neon primary → D1 replica only; no data JSON commits or GitHub-to-Neon overwrite'
