name: Temporary public news source check

on:
  push:
    paths:
      - ".github/workflows/temporary-news-source-check.yml"

permissions:
  contents: read

jobs:
  public-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe GDELT and EMM public interfaces
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          targets = [
            ("gdelt_doc", "https://api.gdeltproject.org/api/v2/doc/doc?query=Iran&mode=artlist&format=json&maxrecords=3&timespan=24h"),
            ("gdelt_lastupdate", "https://data.gdeltproject.org/gdeltv2/lastupdate.txt"),
            ("emm_rss", "https://emm.newsbrief.eu/rss/rss?type=rtn&language=en&duplicates=false"),
            ("emm_current_rss", "https://media-monitor.europa.eu/rss/rss?type=rtn&language=en&duplicates=false"),
            ("emm_current_site", "https://media-monitor.europa.eu/"),
          ]
          for name,url in targets:
            req=urllib.request.Request(url,headers={"Accept":"application/json, application/rss+xml, application/xml, text/html, text/plain","User-Agent":"RegionalWatchResearch/1.0"})
            try:
              with urllib.request.urlopen(req, timeout=18) as r:
                body=r.read(1500).decode("utf-8","replace")
                print(json.dumps({"source":name,"status":r.status,"final_url":r.geturl(),"type":r.headers.get("Content-Type"),"body_prefix":body[:300]},ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print(json.dumps({"source":name,"status":e.code,"final_url":e.geturl(),"type":e.headers.get("Content-Type")}))
            except Exception as e:
              print(json.dumps({"source":name,"error_type":type(e).__name__,"error":str(e)[:100]}))
          PY
