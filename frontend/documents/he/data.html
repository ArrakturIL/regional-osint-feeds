<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1412"><title>נתונים · REGIONAL WATCH</title><meta name="description" content="מעקב אזורי ממקורות פתוחים."><link rel="canonical" href="https://regional-watch.pages.dev/he/data"><link rel="alternate" hreflang="ru" href="https://regional-watch.pages.dev/data"><meta property="og:title" content="נתונים · REGIONAL WATCH"><meta property="og:description" content="מעקב אזורי ממקורות פתוחים."><link rel="stylesheet" href="/assets/app.css?v=rw-editor-bottom-v16"><script defer="" src="/assets/react.js?v=rw-editor-bottom-v16"></script><script defer="" src="/assets/react-dom.js?v=rw-editor-bottom-v16"></script><script defer="" src="/assets/app.js?v=rw-editor-bottom-v16"></script><style id="rw-editor-bottom-v16">

.news-card[data-rw-importance="high"] .rw-importance-badge{border-color:#e0b15c;color:#e0b15c}
